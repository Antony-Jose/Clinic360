<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - Clinic360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* Sidebar styles */
        #sidebar {
            min-height: 100vh;
            position: fixed;
            padding-top: 20px;
            z-index: 100;
        }
        
        /* Main content adjustment */
        main {
            margin-left: 16.66667%; /* Matches col-md-2 width */
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            #sidebar {
                position: static;
                min-height: auto;
            }
            main {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/patient/dashboard">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="/patient/appointments">
                                <i class="bi bi-calendar-check me-2"></i>My Appointments
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/patient/book-appointment">
                                <i class="bi bi-journal-plus me-2"></i>Book Appointment
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/patient/profile">
                                <i class="bi bi-person-circle me-2"></i>Profile
                            </a>
                        </li>
                        <li class="nav-item mt-3">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="btn btn-outline-light w-100">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">My Appointments</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="/patient/book-appointment" class="btn btn-sm btn-primary">
                            <i class="bi bi-plus-circle"></i> Book New Appointment
                        </a>
                    </div>
                </div>

                <!-- Alerts -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Appointment filter -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form id="filterForm" class="row g-3">
                            <div class="col-md-4">
                                <label for="status" class="form-label">Filter by Status</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="">All Appointments</option>
                                    <option value="SCHEDULED">Scheduled</option>
                                    <option value="COMPLETED">Completed</option>
                                    <option value="CANCELLED">Cancelled</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="dateFrom" class="form-label">From Date</label>
                                <input type="date" class="form-control" id="dateFrom" name="dateFrom">
                            </div>
                            <div class="col-md-4">
                                <label for="dateTo" class="form-label">To Date</label>
                                <input type="date" class="form-control" id="dateTo" name="dateTo">
                            </div>
                            <div class="col-12 mt-3">
                                <button type="button" class="btn btn-primary" id="applyFilter">Apply Filter</button>
                                <button type="button" class="btn btn-secondary" id="clearFilter">Clear Filter</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Appointments list -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Time</th>
                                        <th>Doctor</th>
                                        <th>Status</th>
                                        <th>Prescription</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${appointments.empty}">
                                        <td colspan="6" class="text-center">No appointments found</td>
                                    </tr>
                                    <tr th:each="appointment : ${appointments}">
                                        <td th:text="${#temporals.format(appointment.appointmentDate, 'MMM dd, yyyy')}"></td>
                                        <td th:text="${#temporals.format(appointment.startTime, 'hh:mm a') + ' - ' + #temporals.format(appointment.endTime, 'hh:mm a')}"></td>
                                        <td th:text="${appointment.doctorName}"></td>
                                        <td>
                                            <span th:if="${appointment.status.name() == 'SCHEDULED'}" class="badge bg-primary">Scheduled</span>
                                            <span th:if="${appointment.status.name() == 'COMPLETED'}" class="badge bg-success">Completed</span>
                                            <span th:if="${appointment.status.name() == 'CANCELLED'}" class="badge bg-danger">Cancelled</span>
                                        </td>
                                        <td>
                                            <span th:if="${appointment.prescriptionNotes != null && !appointment.prescriptionNotes.empty}">
                                                <button class="btn btn-sm btn-outline-success" 
                                                        data-bs-toggle="modal" 
                                                        th:data-bs-target="'#prescriptionModal' + ${appointment.id}">
                                                    <i class="bi bi-file-medical"></i> View
                                                </button>
                                            </span>
                                            <span th:if="${appointment.prescriptionNotes == null || appointment.prescriptionNotes.empty}">
                                                <i class="bi bi-file-earmark text-muted"></i> None
                                            </span>
                                        </td>
                                        <td>
                                            <form th:if="${appointment.status.name() == 'SCHEDULED'}" 
                                                  th:action="@{/patient/appointments/{id}/cancel(id=${appointment.id})}" 
                                                  method="post">
                                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                                        onclick="return confirm('Are you sure you want to cancel this appointment?')">
                                                    <i class="bi bi-x-circle"></i> Cancel
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Prescription Modals -->
                <div th:each="appointment : ${appointments}" 
                     th:if="${appointment.prescriptionNotes != null && !appointment.prescriptionNotes.empty}" 
                     th:id="'prescriptionModal' + ${appointment.id}" 
                     class="modal fade" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header bg-success text-white">
                                <h5 class="modal-title">Prescription Details</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <div class="mb-3">
                                    <h6>Doctor: <span th:text="${appointment.doctorName}"></span></h6>
                                    <h6>Date: <span th:text="${#temporals.format(appointment.appointmentDate, 'MMM dd, yyyy')}"></span></h6>
                                </div>
                                <div class="p-3 bg-light border rounded">
                                    <p th:text="${appointment.prescriptionNotes}" style="white-space: pre-line;"></p>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <!-- <button type="button" class="btn btn-primary" onclick="window.print();">Print</button> -->
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // JavaScript for filtering
        document.addEventListener('DOMContentLoaded', function() {
            const filterForm = document.getElementById('filterForm');
            const applyFilterBtn = document.getElementById('applyFilter');
            const clearFilterBtn = document.getElementById('clearFilter');
            const statusSelect = document.getElementById('status');
            const dateFromInput = document.getElementById('dateFrom');
            const dateToInput = document.getElementById('dateTo');
            
            applyFilterBtn.addEventListener('click', function() {
                // This is just a client-side filter - in a real application, 
                // you would send this to the server to filter data
                const status = statusSelect.value;
                const dateFrom = dateFromInput.value;
                const dateTo = dateToInput.value;
                
                const rows = document.querySelectorAll('tbody tr');
                
                rows.forEach(row => {
                    let display = true;
                    
                    // Status filter
                    if (status && row.querySelector('td:nth-child(4) span')) {
                        const rowStatus = row.querySelector('td:nth-child(4) span').textContent.trim();
                        if (status === 'SCHEDULED' && rowStatus !== 'Scheduled') display = false;
                        if (status === 'COMPLETED' && rowStatus !== 'Completed') display = false;
                        if (status === 'CANCELLED' && rowStatus !== 'Cancelled') display = false;
                    }
                    
                    // Date filter
                    if (dateFrom || dateTo) {
                        const dateParts = row.querySelector('td:nth-child(1)').textContent.trim().split(' ');
                        const months = {'Jan': '01', 'Feb': '02', 'Mar': '03', 'Apr': '04', 'May': '05', 'Jun': '06', 
                                       'Jul': '07', 'Aug': '08', 'Sep': '09', 'Oct': '10', 'Nov': '11', 'Dec': '12'};
                        const month = months[dateParts[0]];
                        const day = dateParts[1].replace(',', '').padStart(2, '0');
                        const year = dateParts[2];
                        const rowDate = `${year}-${month}-${day}`;
                        
                        if (dateFrom && rowDate < dateFrom) display = false;
                        if (dateTo && rowDate > dateTo) display = false;
                    }
                    
                    row.style.display = display ? '' : 'none';
                });
            });
            
            clearFilterBtn.addEventListener('click', function() {
                statusSelect.value = '';
                dateFromInput.value = '';
                dateToInput.value = '';
                
                document.querySelectorAll('tbody tr').forEach(row => {
                    row.style.display = '';
                });
            });
        });
    </script>
</body>
</html>
