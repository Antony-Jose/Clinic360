<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments by Date - Clinic360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/dashboard">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/availability">
                                <i class="bi bi-calendar-check me-2"></i>Set Availability
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="/doctor/appointments">
                                <i class="bi bi-journal-medical me-2"></i>Appointments
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/patients">
                                <i class="bi bi-people me-2"></i>Patients
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/profile">
                                <i class="bi bi-person-circle me-2"></i>Profile
                            </a>
                        </li>
                        <li class="nav-item mt-3">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="btn btn-outline-light w-100">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Appointments for <span th:text="${#temporals.format(selectedDate, 'MMMM d, yyyy')}"></span></h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="input-group me-2">
                            <input type="date" id="dateFilter" class="form-control" th:value="${selectedDate}">
                            <button id="filterByDateBtn" class="btn btn-outline-secondary">
                                <i class="bi bi-funnel"></i> Filter
                            </button>
                        </div>
                        <div class="btn-group">
                            <a href="/doctor/appointments" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-list"></i> All
                            </a>
                            <a th:href="@{/doctor/appointments/date(date=${T(java.time.LocalDate).now()})}" 
                               class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-calendar-day"></i> Today
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Alerts -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Daily schedule card -->
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Daily Schedule</h4>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th style="width: 15%">Time</th>
                                        <th style="width: 25%">Patient</th>
                                        <th style="width: 15%">Status</th>
                                        <th style="width: 15%">Prescription</th>
                                        <th style="width: 30%">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${appointments.empty}">
                                        <td colspan="5" class="text-center">No appointments scheduled for this date</td>
                                    </tr>
                                    <tr th:each="appointment : ${appointments}">
                                        <td th:text="${#temporals.format(appointment.startTime, 'hh:mm a') + ' - ' + #temporals.format(appointment.endTime, 'hh:mm a')}"></td>
                                        <td th:text="${appointment.patientName}"></td>
                                        <td>
                                            <span th:if="${appointment.status.name() == 'SCHEDULED'}" class="badge bg-primary">Scheduled</span>
                                            <span th:if="${appointment.status.name() == 'COMPLETED'}" class="badge bg-success">Completed</span>
                                            <span th:if="${appointment.status.name() == 'CANCELLED'}" class="badge bg-danger">Cancelled</span>
                                        </td>
                                        <td>
                                            <span th:if="${appointment.prescriptionNotes != null && !appointment.prescriptionNotes.empty}">
                                                <i class="bi bi-file-medical text-success"></i> Added
                                            </span>
                                            <span th:if="${appointment.prescriptionNotes == null || appointment.prescriptionNotes.empty}">
                                                <i class="bi bi-file-earmark text-muted"></i> None
                                            </span>
                                        </td>
                                        <td>
                                            <a th:href="@{/doctor/appointments/{id}(id=${appointment.id})}" 
                                               class="btn btn-sm btn-outline-primary">
                                                <i class="bi bi-eye"></i> View
                                            </a>
                                            
                                            <form th:if="${appointment.status.name() == 'SCHEDULED'}" 
                                                  th:action="@{/doctor/appointments/{id}/status(id=${appointment.id})}" 
                                                  method="post" class="d-inline ms-1">
                                                <input type="hidden" name="status" value="COMPLETED">
                                                <button type="submit" class="btn btn-sm btn-outline-success">
                                                    <i class="bi bi-check-circle"></i> Complete
                                                </button>
                                            </form>
                                            
                                            <form th:if="${appointment.status.name() == 'SCHEDULED'}" 
                                                  th:action="@{/doctor/appointments/{id}/status(id=${appointment.id})}" 
                                                  method="post" class="d-inline ms-1">
                                                <input type="hidden" name="status" value="CANCELLED">
                                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                                        onclick="return confirm('Are you sure you want to cancel this appointment?')">
                                                    <i class="bi bi-x-circle"></i> Cancel
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Navigation to adjacent days -->
                <div class="d-flex justify-content-between mb-4">
                    <a th:href="@{/doctor/appointments/date(date=${selectedDate.minusDays(1)})}" class="btn btn-outline-primary">
                        <i class="bi bi-chevron-left"></i> Previous Day
                    </a>
                    <a th:href="@{/doctor/appointments/date(date=${selectedDate.plusDays(1)})}" class="btn btn-outline-primary">
                        Next Day <i class="bi bi-chevron-right"></i>
                    </a>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // JavaScript for date filter
        document.addEventListener('DOMContentLoaded', function() {
            const dateFilter = document.getElementById('dateFilter');
            const filterBtn = document.getElementById('filterByDateBtn');
            
            // Filter button event listener
            filterBtn.addEventListener('click', function() {
                if (dateFilter.value) {
                    window.location.href = `/doctor/appointments/date?date=${dateFilter.value}`;
                }
            });
        });
    </script>
</body>
</html>
