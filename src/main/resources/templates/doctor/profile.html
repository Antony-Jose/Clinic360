<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile - Clinic360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/dashboard">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/availability">
                                <i class="bi bi-calendar-check me-2"></i>Set Availability
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/appointments">
                                <i class="bi bi-journal-medical me-2"></i>Appointments
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/patients">
                                <i class="bi bi-people me-2"></i>Patients
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="/doctor/profile">
                                <i class="bi bi-person-circle me-2"></i>Profile
                            </a>
                        </li>
                        <li class="nav-item mt-3">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="btn btn-outline-light w-100">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Doctor Profile</h1>
                </div>

                <!-- Alerts -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="row">
                    <!-- Profile Card -->
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                <h5 class="card-title mb-0">Doctor Information</h5>
                            </div>
                            <div class="card-body text-center">
                                <i class="bi bi-person-circle fs-1 text-primary mb-3"></i>
                                <h4>Dr. <span th:text="${doctor.firstName + ' ' + doctor.lastName}"></span></h4>
                                <p class="text-muted" th:text="${doctor.specialization}">Specialization</p>
                                <div class="d-flex justify-content-center">
                                    <span class="badge bg-info me-2">Doctor</span>
                                    <span class="badge bg-secondary" th:text="${'ID: ' + doctor.id}">ID</span>
                                </div>
                                <hr />
                                <div class="text-start mt-3">
                                    <p><i class="bi bi-envelope me-2"></i> <span th:text="${doctor.email}">Email</span></p>
                                    <p><i class="bi bi-telephone me-2"></i> <span th:text="${doctor.phoneNumber}">Phone</span></p>
                                    <p><i class="bi bi-card-text me-2"></i> License: <span th:text="${doctor.licenseNumber}">License Number</span></p>
                                    <p><i class="bi bi-person-badge me-2"></i> Username: <span th:text="${doctor.username}">Username</span></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Edit Profile Form -->
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                <h5 class="card-title mb-0">Edit Profile</h5>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/doctor/profile/update}" method="post" th:object="${profileUpdateRequest}">
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label for="firstName" class="form-label">First Name</label>
                                            <input type="text" class="form-control" id="firstName" th:field="*{firstName}" th:placeholder="${doctor.firstName}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="lastName" class="form-label">Last Name</label>
                                            <input type="text" class="form-control" id="lastName" th:field="*{lastName}" th:placeholder="${doctor.lastName}">
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label for="email" class="form-label">Email</label>
                                            <input type="email" class="form-control" id="email" th:field="*{email}" th:placeholder="${doctor.email}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="phoneNumber" class="form-label">Phone Number</label>
                                            <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" th:placeholder="${doctor.phoneNumber}">
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label for="specialization" class="form-label">Specialization</label>
                                            <input type="text" class="form-control" id="specialization" th:field="*{specialization}" th:placeholder="${doctor.specialization}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="licenseNumber" class="form-label">License Number</label>
                                            <input type="text" class="form-control" id="licenseNumber" th:field="*{licenseNumber}" th:placeholder="${doctor.licenseNumber}">
                                        </div>
                                    </div>
                                    
                                    <hr class="my-4" />
                                    <h5>Change Password</h5>
                                    <div class="row mb-3">
                                        <div class="col-md-12">
                                            <label for="currentPassword" class="form-label">Current Password</label>
                                            <input type="password" class="form-control" id="currentPassword" th:field="*{currentPassword}">
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label for="newPassword" class="form-label">New Password</label>
                                            <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}">
                                        </div>
                                    </div>
                                    
                                    <div class="text-end">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-save me-2"></i>Save Changes
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
