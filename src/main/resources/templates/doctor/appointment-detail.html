<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Detail - Clinic360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/dashboard">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/availability">
                                <i class="bi bi-calendar-check me-2"></i>Set Availability
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="/doctor/appointments">
                                <i class="bi bi-journal-medical me-2"></i>Appointments
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/patients">
                                <i class="bi bi-people me-2"></i>Patients
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="/doctor/profile">
                                <i class="bi bi-person-circle me-2"></i>Profile
                            </a>
                        </li>
                        <li class="nav-item mt-3">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="btn btn-outline-light w-100">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Appointment Detail</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="/doctor/appointments" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Appointments
                        </a>
                    </div>
                </div>

                <!-- Alerts -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Appointment details -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header bg-primary text-white">
                                <h4 class="mb-0">Appointment Information</h4>
                            </div>
                            <div class="card-body">
                                <div class="mb-3 row">
                                    <label class="col-sm-4 col-form-label fw-bold">Appointment ID:</label>
                                    <div class="col-sm-8">
                                        <p class="form-control-plaintext" th:text="${appointment.id}"></p>
                                    </div>
                                </div>
                                <div class="mb-3 row">
                                    <label class="col-sm-4 col-form-label fw-bold">Date:</label>
                                    <div class="col-sm-8">
                                        <p class="form-control-plaintext" 
                                           th:text="${#temporals.format(appointment.appointmentDate, 'MMM dd, yyyy')}"></p>
                                    </div>
                                </div>
                                <div class="mb-3 row">
                                    <label class="col-sm-4 col-form-label fw-bold">Time:</label>
                                    <div class="col-sm-8">
                                        <p class="form-control-plaintext" 
                                           th:text="${#temporals.format(appointment.startTime, 'hh:mm a') + ' - ' + #temporals.format(appointment.endTime, 'hh:mm a')}"></p>
                                    </div>
                                </div>
                                <div class="mb-3 row">
                                    <label class="col-sm-4 col-form-label fw-bold">Status:</label>
                                    <div class="col-sm-8">
                                        <p class="form-control-plaintext">
                                            <span th:if="${appointment.status.name() == 'SCHEDULED'}" class="badge bg-primary">Scheduled</span>
                                            <span th:if="${appointment.status.name() == 'COMPLETED'}" class="badge bg-success">Completed</span>
                                            <span th:if="${appointment.status.name() == 'CANCELLED'}" class="badge bg-danger">Cancelled</span>
                                        </p>
                                    </div>
                                </div>
                                <div class="mb-3 row">
                                    <label class="col-sm-4 col-form-label fw-bold">Created At:</label>
                                    <div class="col-sm-8">
                                        <p class="form-control-plaintext" 
                                           th:text="${#temporals.format(appointment.createdAt, 'MMM dd, yyyy hh:mm a')}"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header bg-info text-white">
                                <h4 class="mb-0">Patient Information</h4>
                            </div>
                            <div class="card-body">
                                <div class="mb-3 row">
                                    <label class="col-sm-4 col-form-label fw-bold">Patient Name:</label>
                                    <div class="col-sm-8">
                                        <p class="form-control-plaintext" 
                                           th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName}"></p>
                                    </div>
                                </div>
                                <div class="mb-3 row">
                                    <label class="col-sm-4 col-form-label fw-bold">Email:</label>
                                    <div class="col-sm-8">
                                        <p class="form-control-plaintext" th:text="${appointment.patient.email}"></p>
                                    </div>
                                </div>
                                <div class="mb-3 row" th:if="${appointment.patient.phoneNumber != null}">
                                    <label class="col-sm-4 col-form-label fw-bold">Phone Number:</label>
                                    <div class="col-sm-8">
                                        <p class="form-control-plaintext" th:text="${appointment.patient.phoneNumber}"></p>
                                    </div>
                                </div>
                                <div class="mb-3 row" th:if="${appointment.patient.dateOfBirth != null}">
                                    <label class="col-sm-4 col-form-label fw-bold">Date of Birth:</label>
                                    <div class="col-sm-8">
                                        <p class="form-control-plaintext" 
                                           th:text="${#temporals.format(appointment.patient.dateOfBirth, 'MMM dd, yyyy')}"></p>
                                    </div>
                                </div>
                                <div class="mb-3 row" th:if="${appointment.patient.address != null}">
                                    <label class="col-sm-4 col-form-label fw-bold">Address:</label>
                                    <div class="col-sm-8">
                                        <p class="form-control-plaintext" th:text="${appointment.patient.address}"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Prescription -->
                <div class="card mb-4">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Prescription</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${appointment.prescriptionNotes != null && !appointment.prescriptionNotes.empty}">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Current Prescription Notes:</label>
                                <div class="p-3 bg-light border rounded">
                                    <p th:text="${appointment.prescriptionNotes}" style="white-space: pre-line;"></p>
                                </div>
                            </div>
                            <button class="btn btn-warning" type="button" id="editPrescriptionBtn">
                                <i class="bi bi-pencil"></i> Edit Prescription
                            </button>
                        </div>
                        
                        <div th:if="${appointment.prescriptionNotes == null || appointment.prescriptionNotes.empty}" 
                             id="noPrescriptionDiv">
                            <p class="text-muted">No prescription has been added for this appointment yet.</p>
                            <button class="btn btn-primary" type="button" id="addPrescriptionBtn">
                                <i class="bi bi-plus-circle"></i> Add Prescription
                            </button>
                        </div>
                        
                        <div class="mt-3" id="prescriptionFormDiv" 
                             th:style="${appointment.prescriptionNotes == null || appointment.prescriptionNotes.empty} ? 'display: none;' : 'display: none;'">
                            <form th:action="@{/doctor/appointments/{id}/prescription(id=${appointment.id})}" method="post">
                                <div class="mb-3">
                                    <label for="prescriptionNotes" class="form-label">Prescription Notes</label>
                                    <textarea class="form-control" id="prescriptionNotes" name="prescriptionNotes" 
                                              rows="6" placeholder="Enter prescription details here..."
                                              th:text="${appointment.prescriptionNotes}"></textarea>
                                </div>
                                <div class="d-flex">
                                    <button type="submit" class="btn btn-success me-2">
                                        <i class="bi bi-save"></i> Save Prescription
                                    </button>
                                    <button type="button" class="btn btn-secondary" id="cancelPrescriptionBtn">
                                        <i class="bi bi-x-circle"></i> Cancel
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Action buttons for appointment status -->
                <div class="card mb-4" th:if="${appointment.status.name() == 'SCHEDULED'}">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">Appointment Actions</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/doctor/appointments/{id}/status(id=${appointment.id})}" method="post" class="d-inline">
                            <input type="hidden" name="status" value="COMPLETED">
                            <button type="submit" class="btn btn-success me-2">
                                <i class="bi bi-check-circle"></i> Mark as Completed
                            </button>
                        </form>
                        <form th:action="@{/doctor/appointments/{id}/status(id=${appointment.id})}" method="post" class="d-inline">
                            <input type="hidden" name="status" value="CANCELLED">
                            <button type="submit" class="btn btn-danger" 
                                    onclick="return confirm('Are you sure you want to cancel this appointment?')">
                                <i class="bi bi-x-circle"></i> Cancel Appointment
                            </button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // JavaScript for showing/hiding prescription form
        document.addEventListener('DOMContentLoaded', function() {
            const addPrescriptionBtn = document.getElementById('addPrescriptionBtn');
            const editPrescriptionBtn = document.getElementById('editPrescriptionBtn');
            const cancelPrescriptionBtn = document.getElementById('cancelPrescriptionBtn');
            const prescriptionFormDiv = document.getElementById('prescriptionFormDiv');
            const noPrescriptionDiv = document.getElementById('noPrescriptionDiv');
            
            if (addPrescriptionBtn) {
                addPrescriptionBtn.addEventListener('click', function() {
                    prescriptionFormDiv.style.display = 'block';
                    noPrescriptionDiv.style.display = 'none';
                });
            }
            
            if (editPrescriptionBtn) {
                editPrescriptionBtn.addEventListener('click', function() {
                    prescriptionFormDiv.style.display = 'block';
                    editPrescriptionBtn.style.display = 'none';
                });
            }
            
            if (cancelPrescriptionBtn) {
                cancelPrescriptionBtn.addEventListener('click', function() {
                    prescriptionFormDiv.style.display = 'none';
                    if (noPrescriptionDiv) {
                        noPrescriptionDiv.style.display = 'block';
                    } else {
                        editPrescriptionBtn.style.display = 'block';
                    }
                });
            }
        });
    </script>
</body>
</html>
